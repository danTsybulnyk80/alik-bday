<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Совершенно секретно</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Marck+Script&family=Russo+One&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', 'Marck Script', cursive;
      background: #1c2541 linear-gradient(180deg, #0b132b, #34507a 35%, #1c2541 65%, #000) fixed;
    }

    /* Sparkle overlay. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, #fff 0 1.2px, transparent 2px),
        radial-gradient(circle, #fff9 0 2px, transparent 3px),
        radial-gradient(circle, #ffe9 0 1px, transparent 2px);
      background-size: 87px 72px, 140px 155px, 49px 64px;
      background-position: 11px 19px, 42px 64px, 26px 8px;
      pointer-events: none;
    }

    .leaflet {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 560px;
      padding: 72px 20px;
      text-align: center;
    }

    .corner {
      position: absolute;
      font-size: 56px;
      line-height: 1;
    }

    .corner.tl { top: 8px; left: 8px; }
    .corner.tr { top: 8px; right: 8px; transform: scaleX(-1); }
    .corner.bl { bottom: 8px; left: 8px; }
    .corner.br { bottom: 8px; right: 8px; transform: scaleX(-1); }

    /* WordArt, the pride of every school computer class. */
    .wordart {
      margin: 0;
      font-family: 'Lobster', 'Comic Sans MS', cursive;
      font-size: clamp(48px, 15vw, 84px);
      font-weight: 400;
      line-height: 1.05;
      color: #f1f5f9;
      text-shadow:
        -1.5px -1.5px 0 #1d4ed8, 1.5px -1.5px 0 #1d4ed8,
        -1.5px 1.5px 0 #1d4ed8, 1.5px 1.5px 0 #1d4ed8,
        3px 3px 0 #1e3a8a, 5px 5px 0 #172554, 7px 7px 6px #000a;
    }

    .script {
      margin: 0;
      font-family: 'Marck Script', 'Comic Sans MS', cursive;
      font-size: clamp(24px, 7vw, 34px);
      line-height: 1.2;
      color: #fff;
      text-shadow: 0 0 3px #000, 1px 1px 2px #000, 0 0 10px #ff4fd8;
    }

    .comic {
      margin: 0;
      font-size: clamp(16px, 4.6vw, 22px);
      font-weight: 700;
      color: #fff;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }

    .big-emoji {
      font-size: clamp(72px, 24vw, 120px);
      line-height: 1.1;
    }

    .quote {
      margin: 0;
      font-family: 'Marck Script', 'Comic Sans MS', cursive;
      font-size: clamp(22px, 6.4vw, 32px);
      line-height: 1.2;
      color: #e0e7ff;
      text-shadow: 0 0 8px #60a5fa, 1px 1px 2px #000;
    }

    .quote cite {
      display: block;
      margin-top: 4px;
      font-size: 0.7em;
      font-style: normal;
      color: #93c5fd;
    }

    .secret-box {
      width: 100%;
      padding: 18px 20px 22px;
      border: 6px dashed #ffe600;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 10px 28px #0007;
    }

    .secret-label {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #d00000;
    }

    .secret {
      min-height: 1.15em;
      margin: 0;
      font-family: 'Russo One', 'Arial Black', sans-serif;
      font-size: clamp(32px, 11vw, 84px);
      line-height: 1.15;
      letter-spacing: 0.03em;
      color: #1a1a1a;
      overflow-wrap: anywhere;
    }

    .secret.empty {
      font: 400 18px/1.4 system-ui, sans-serif;
      letter-spacing: 0;
      color: #888;
    }

    .stamp {
      padding: 6px 16px;
      border: 4px solid #d00000;
      border-radius: 10px;
      font-family: 'Russo One', 'Arial Black', sans-serif;
      font-size: 20px;
      text-transform: uppercase;
      color: #d00000;
      background: #fff;
      transform: rotate(-8deg);
    }
  </style>
</head>
<body>
  <main class="leaflet">
    <span class="corner tl">🐺</span><span class="corner tr">🐺</span>
    <span class="corner bl">🔥</span><span class="corner br">🔥</span>

    <p class="script">☝️ Запомни, брат ☝️</p>
    <h1 class="wordart">Совершенно секретно</h1>

    <div class="big-emoji">🐺🌕</div>
    <blockquote class="quote">
      «Пароль знает не тот, кто умный,<br>а тот, кто именинник»
      <cite>© Волк, АУФ</cite>
    </blockquote>
    <span class="stamp">Сила в правде</span>

    <div class="secret-box">
      <p class="secret-label">🔐 Пароль 🔐</p>
      <p class="secret" id="password" role="status"></p>
    </div>

    <p class="comic">Никому не говори. Даже маме. Особенно маме. 🤐</p>
    <p class="script">Перешли 10 друзьям, и будет тебе счастье 🍀</p>
  </main>
  <script src="js/password.js"></script>
</body>
</html>
