<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Запись пароля</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">Только для организаторов</p>
    <h1>Запись пароля</h1>
    <p>Этот пароль Алик увидит на <a href="password.html">третьей листовке</a>. Новый пароль заменяет предыдущий.</p>
    <form class="stack" id="password-form">
      <input id="token" type="password" aria-label="Токен GitHub" placeholder="Токен GitHub" autocomplete="off" required>
      <input id="password" type="text" aria-label="Пароль" placeholder="Пароль" autocomplete="off" required>
      <button class="button" id="submit" type="submit">Сохранить</button>
    </form>
    <p class="feedback" id="status" role="status"></p>
  </main>
  <script src="js/set-password.js"></script>
</body>
</html>
