<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Квест | С днём рождения, Алик!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" id="card">
    <p class="eyebrow" id="progress"></p>
    <h1 id="question-text"></h1>
    <form id="quiz-form" autocomplete="off">
      <input id="answer" type="text" aria-label="Твой ответ" placeholder="Твой ответ" required>
      <button class="button" id="submit" type="submit">Проверить</button>
    </form>
    <p class="feedback" id="feedback" role="status"></p>
  </main>
  <script src="js/quiz.js"></script>
</body>
</html>
